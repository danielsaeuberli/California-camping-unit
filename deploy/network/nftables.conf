#!/usr/sbin/nft -f
# /etc/nftables.conf - camper unit (SPEC 2.7)
# The Cerbo access point is shared with anyone who has the password on the Cerbo label.
# On wlan0 the Pi only talks out (MQTT to the Cerbo); no new inbound connections.
# eth0 (camper router) stays open for SSH. The UI listens on 127.0.0.1 only.
flush ruleset

table inet camper {
  chain input {
    type filter hook input priority 0; policy accept;
    iifname "lo" accept
    iifname "wlan0" ct state established,related accept
    iifname "wlan0" icmp type echo-request accept
    iifname "wlan0" drop
  }
}
