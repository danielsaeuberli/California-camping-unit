name: test
on:
  push:
    branches: [v2, main]
  pull_request:
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev
      - run: make test
      - run: make sim-shot
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: build/*.bmp
